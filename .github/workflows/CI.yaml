name: CI

on:
  push:

jobs:
  python-environment:
    name: Prepare python environment
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install base dependencies
        run: pip install --upgrade pip && pip install -r requirements_test.txt
      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: |
            venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements_test.txt') }}

  compilation:
    runs-on: ubuntu-latest
    needs: python-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements_test.txt') }}
      - name: Check compilation
        run: python -m compileall -q .

  ruff:
    runs-on: ubuntu-latest
    needs: python-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements_test.txt') }}
      - run: pip install ruff
      - run: ruff check .

  mypy:
    runs-on: ubuntu-latest
    needs: python-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements_test.txt') }}
      - run: pip install mypy
      - run: mypy -p taphome_sdk --ignore-missing-imports --explicit-package-bases

  pylint:
    runs-on: ubuntu-latest
    needs: python-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore virtualenv
        uses: actions/cache@v4
        with:
          path: venv
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements_test.txt') }}
      - run: pip install pylint
      - run: pylint . --fail-under=9.4

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
