# .github/workflows/ci.yml
name: CI
on:
  push:
jobs:
  prepare-python-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv
      - run: .venv/bin/pip install --upgrade pip
      - run: .venv/bin/pip install homeassistant
      # The SDK lives in its own repository and on PyPI; CI installs it from
      # git so lint/compile checks resolve the taphome_sdk imports.
      - run: .venv/bin/pip install "taphome-sdk @ git+https://github.com/martindybal/taphome-sdk.git@main"
      - run: tar -czf python-env.tar.gz .venv
      - uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz

  compilation:
    needs: prepare-python-env
    uses: ./.github/workflows/python-check.yml
    with:
      name: "compile"
      command: "python -m compileall -q ."

  ruff:
    needs: prepare-python-env
    uses: ./.github/workflows/python-check.yml
    with:
      package: "ruff"
      command: "ruff check ."

  pylint:
    needs: prepare-python-env
    uses: ./.github/workflows/python-check.yml
    with:
      package: "pylint"
      command: "pylint . --fail-under=9.5"

  pytest:
    needs: prepare-python-env
    uses: ./.github/workflows/python-check.yml
    with:
      package: "pytest-homeassistant-custom-component"
      command: "python -m pytest tests"

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
