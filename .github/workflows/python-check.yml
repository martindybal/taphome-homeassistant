name: python-check
on:
  workflow_call:
    inputs:
      name:
        description: "Name of the step, e.g. 'ruff check'"
        required: false
        type: string
      package:
        description: "step dependencies, which will be installed before running the command. e.g. 'ruff mypy'"
        required: false
        type: string
      command:
        description: "Command to run, e.g. 'ruff check .'"
        required: true
        type: string

jobs:
  run-check:
    name: ${{ inputs.name || inputs.command }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The shared venv symlinks this interpreter, so install it here too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: python-env
          path: .
      - run: tar -xzf python-env.tar.gz
      - if: ${{ inputs.package != '' }}
        run: .venv/bin/pip install ${{ inputs.package }}
      - name: Run ${{ inputs.name || inputs.command }}
        shell: bash
        run: |
          source .venv/bin/activate
          ${{ inputs.command }}
