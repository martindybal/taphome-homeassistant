# Draft of homeassistant/components/taphome/quality_scale.yaml for the Core
# port (see CLAUDE.md "Keeping the Home Assistant Core port in sync").
# hassfest requires every rule of every tier to be listed; keep this file in
# sync with the rules list in script/hassfest/quality_scale.py when porting.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom service actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration does not register custom service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  # Cores announce `_th-discovery._tcp.local.` via mDNS; TXT records carry
  # Name, LocationId (= the config-entry unique id) and IpOnLocalNetwork
  # (verified on real Cores 2026-07-08; no SSDP, DHCP hostnames unusable).
  discovery: done
  discovery-update-info: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      Which Home Assistant platform a TapHome device should be exposed as is
      the user's decision (the same physical device can be a light, fan or
      valve), so devices cannot be added automatically. Newly exposed devices
      are detected periodically and raise a fixable repair issue that walks
      the user through adding them.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: |
      Only devices the user explicitly selected are exposed, so there are no
      less-popular or noisy entities to disable by default.
  entity-translations:
    status: exempt
    comment: |
      Entities take the name of their TapHome device (name is None and
      has_entity_name is True); the only integration-defined entity, the
      Core connectivity sensor, is named by its device class.
  exception-translations: done
  icon-translations:
    status: exempt
    comment: |
      Entities rely on their device classes for icons; there are no custom
      state icons.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
