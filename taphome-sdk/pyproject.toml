[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taphome-sdk"
version = "0.1.0"
description = "Python SDK for TapHome smart home systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martin Dybal", email = "martin@dybal.it"},
]
maintainers = [
    {name = "Martin Dybal", email = "martin@dybal.it"},
]
keywords = ["taphome", "smart home", "home automation", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiohttp>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/martindybal/taphome-homeassistant"
Repository = "https://github.com/martindybal/taphome-homeassistant"
Issues = "https://github.com/martindybal/taphome-homeassistant/issues"
Documentation = "https://github.com/martindybal/taphome-homeassistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"